# App + PostgreSQL for local testing.
#
#   docker compose up --build        app on http://localhost:3000
#
# The database sits on an internal network that only the app can reach, and
# publishes no host port, so it cannot clash with other PostgreSQL servers on
# this machine. To reach it from the host (for `npm run dev` / `npm run dev:api`),
# add the host-db override, which publishes it on 127.0.0.1:${DB_PORT:-5432}:
#
#   docker compose -f docker-compose.yml -f docker-compose.host-db.yml up db
#
# db/migrations runs automatically, but only when the data volume is empty.
# The volume is named so test datasets can be swapped without losing any:
#
#   DB_VOLUME=tlm-db-scratch docker compose up    use (or create) another dataset
#   docker compose down -v                        delete the current volume to start fresh

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-terria}
      POSTGRES_USER: ${POSTGRES_USER:-terria}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-terria}
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./db/migrations:/docker-entrypoint-initdb.d:ro
    networks:
      - db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 5s
      retries: 15

  app:
    build: .
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-terria}:${POSTGRES_PASSWORD:-terria}@db:5432/${POSTGRES_DB:-terria}
      PORT: 3000
    ports:
      - "${APP_PORT:-3000}:3000"
    volumes:
      # Published and test init files, served at /config.
      - config-data:/app/config
    networks:
      - default
      - db
    depends_on:
      db:
        condition: service_healthy

networks:
  # Internal: no route to the host or outside world, and only the app joins it.
  db:
    internal: true

volumes:
  db-data:
    name: ${DB_VOLUME:-terriajs-init-manager-db}
  config-data:
    name: ${CONFIG_VOLUME:-terriajs-init-manager-config}
