# GitLab CI: lint, test, build and documentation on every push; GitLab Pages
# for the docs on the default branch; and a version check on release tags
# (see docs/development/releasing.md).

stages:
  - check
  - test
  - build
  - deploy

default:
  interruptible: true

variables:
  npm_config_cache: "$CI_PROJECT_DIR/.npm"

.node:
  image: node:22-alpine
  cache:
    key:
      files: [package-lock.json]
    paths: [.npm/]
  before_script:
    - npm ci --prefer-offline --no-audit --no-fund

lint:
  extends: .node
  stage: check
  script:
    - npm run lint
    - npx tsc -b

test:
  extends: .node
  stage: test
  services:
    - name: postgres:17-alpine
      alias: postgres
  variables:
    POSTGRES_DB: terria_test
    POSTGRES_USER: terria
    POSTGRES_PASSWORD: terria
    TEST_DATABASE_URL: postgres://terria:terria@postgres:5432/terria_test
  script:
    - >-
      npx vitest run --coverage
      --coverage.reporter=text-summary --coverage.reporter=cobertura
      --reporter=default --reporter=junit --outputFile.junit=junit.xml
  coverage: '/^Lines\s*:\s*([\d.]+)%/'
  artifacts:
    when: always
    expire_in: 1 week
    reports:
      junit: junit.xml
      coverage_report:
        coverage_format: cobertura
        path: coverage/cobertura-coverage.xml

build:
  extends: .node
  stage: build
  script:
    - npm run build
  artifacts:
    expire_in: 1 week
    paths: [dist/]

docs:
  stage: build
  image: python:3.12-slim
  cache:
    key: pip-docs
    paths: [.pip/]
  variables:
    PIP_CACHE_DIR: "$CI_PROJECT_DIR/.pip"
  script:
    - pip install -r docs/requirements.txt
    - sphinx-build -W --keep-going -b html docs docs/_build/html
  artifacts:
    expire_in: 1 week
    paths: [docs/_build/html/]

# Publishes the docs from the default branch (if GitLab Pages is enabled).
pages:
  stage: deploy
  image: alpine:3.20
  needs: [docs]
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  script:
    - cp -r docs/_build/html public
  artifacts:
    paths: [public]

# A release tag must match package.json and have a changelog entry.
release-check:
  stage: check
  image: node:22-alpine
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+/
  script:
    - VERSION=$(node -p "require('./package.json').version")
    - test "$CI_COMMIT_TAG" = "v$VERSION" || { echo "Tag $CI_COMMIT_TAG doesn't match package.json version $VERSION"; exit 1; }
    - grep -q "^## \[$VERSION\]" CHANGELOG.md || { echo "CHANGELOG.md has no section for $VERSION"; exit 1; }
